<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Peta SIG Erisa</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin=""
    />

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
        crossorigin=""
    ></script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script>

        // Membuat peta
        var map = L.map('map', {
            attributionControl: false
        }).setView([-7.33061, 108.257], 12);


        // Attribution
        L.control.attribution({
            prefix: false
        }).addTo(map);


        // Raster Tiles
        var tilesource_layer = L.tileLayer(
            './{z}/{x}/{y}.jpg',
            {
                minZoom: 11,
                maxZoom: 14,
                tms: false,
                attribution: 'Created by QGIS'
            }
        ).addTo(map);

    </script>

</body>
</html>
